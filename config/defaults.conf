# agent-sandbox defaults. Do not edit - override in config/sandbox.conf (see sandbox.conf.example).
# Values are frozen into each sandbox at `sandbox create` time.

# VM resources
CPUS=4
MEMORY_GIB=8
DISK_GIB=60

# Egress policy: allowlist (agent may only reach allowlisted domains via the proxy) | open
NETWORK_MODE=allowlist
# Allowlist presets from config/allowlist/<name>.txt
ALLOWLISTS="core java"
EXTRA_ALLOW_DOMAINS=""
# Private IPv4 ranges the VM may reach (e.g. corporate Nexus/GHES), space/comma separated CIDRs
ALLOW_CIDRS=""
# block = the agent cannot do DNS lookups itself (proxy resolves names) | allow
AGENT_DNS=block
# Optional corporate proxy for the in-VM squid: http://[user:pass@]host:port
UPSTREAM_PROXY=""

# Git / GitHub
# The repository is given as SSH URL to `sandbox create NAME SSH_URL`; GIT_HOST is derived from it.
GH_HOST=github.com           # host used by gh (pull requests); may be a GitHub Enterprise Server
COPILOT_HOST=github.com      # host the Copilot CLI authenticates against (github.com or <tenant>.ghe.com)
GIT_USER_NAME=""             # empty = take from host 'git config --global user.name'
GIT_USER_EMAIL=""

# Toolchain inside the VM
JDK_VERSIONS="25"            # Temurin JDKs, first one is the default, e.g. "21 25 17"
GRADLE_VERSION=9.8.1
MAVEN_VERSION=3.9.16
NODE_MAJOR=24
COPILOT_VERSION=""           # empty = latest @github/copilot
EXTRA_APT_PACKAGES=""

# Agent command started by `sandbox agent` (split on spaces, no quoting)
AGENT_CMD="copilot --yolo"
# Flag used to pass an initial prompt ("" = pass the prompt as a positional argument)
AGENT_PROMPT_ARG="-i"
