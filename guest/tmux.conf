# agent-sandbox tmux defaults (/etc/tmux.conf)

# Never let programs inside the VM write to the host clipboard (OSC 52) or pass raw
# escape sequences through to the host terminal.
set -g set-clipboard off
set -g allow-passthrough off

set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"
set -g status-style "bg=magenta,fg=black"
set -g status-left "[sandbox #{session_name}] "
set -g status-left-length 40
set -g status-right "Ctrl-b d = detach (agent keeps running) "
set -g status-right-length 50
